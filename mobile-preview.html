<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Mobile preview — fAIrwall AI</title><style>body{margin:0;background:#0a1628;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px}.bar{display:flex;gap:8px;align-items:center;color:#fff;font-size:13px}button{font:inherit;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;cursor:pointer}button.on{background:#fff;color:#0a1628}.phone{width:390px;height:844px;border:10px solid #16233a;border-radius:38px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5);background:#fff}iframe{width:100%;height:100%;border:0}a{color:#7dd3c0}</style></head><body><div class="bar"><span>Width</span><button class="on" data-w="390">390</button><button data-w="360">360</button><button data-w="430">430</button><span style="margin-left:12px">Page</span><button class="on" data-p="index.html">EN</button><button data-p="index-de.html">DE</button></div><div class="phone" id="phone"><iframe id="f" src="./index.html"></iframe></div><script>const phone=document.getElementById('phone'),f=document.getElementById('f');document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const g=b.dataset.w?'[data-w]':'[data-p]';document.querySelectorAll(g).forEach(x=>x.classList.remove('on'));b.classList.add('on');if(b.dataset.w)phone.style.width=b.dataset.w+'px';else f.src='./'+b.dataset.p;});</script></body></html>
