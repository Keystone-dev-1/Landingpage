# Netlify build config — static site, no build step
[build]
  publish = "."
  command = ""

# Host canonicalization (www vs bare) is handled by Netlify's own
# domain settings — do NOT add a forced redirect here, it causes a loop.

# Pretty URLs
[[redirects]]
  from = "/de"
  to = "/index-de.html"
  status = 200
[[redirects]]
  from = "/de/"
  to = "/index-de.html"
  status = 200
[[redirects]]
  from = "/en"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/demo"
  to = "/book-demo.html"
  status = 301
[[redirects]]
  from = "/pricing"
  to = "/#pricing"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jsx"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
